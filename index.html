<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khu Vườn Bí Mật</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #fbf7f4; color: #443e3d; padding: 15px; min-height: 100vh; overflow-x: hidden; }
.container { width: 100%; max-width: 500px; margin: 0 auto; }
#welcome-screen { text-align: center; padding-top: 80px; }
.logo-garden { font-size: 60px; margin-bottom: 20px; }
.welcome-title { color: #6d5c7e; font-size: 28px; margin-bottom: 12px; }
.welcome-desc { color: #8e8294; font-size: 15px; font-style: italic; margin-bottom: 40px; line-height: 1.6; }
.enter-btn { background: #6d5c7e; color: white; border: none; padding: 16px 35px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; }
#main-content { display: none; }
header { text-align: center; margin-bottom: 25px; }
h1 { color: #6d5c7e; font-size: 26px; }
.badge-secure { display: inline-block; background-color: #f0ebf7; color: #6d5c7e; padding: 6px 12px; border-radius: 20px; font-size: 12px; margin-top: 12px; }
.tabs { display: flex; background: #eee7e1; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
.tab-btn { flex: 1; background: none; border: none; padding: 10px; font-size: 13px; font-weight: bold; color: #7a6f6d; cursor: pointer; }
.tab-btn.active { background: #fff; color: #6d5c7e; border-radius: 9px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.form-box { background: #fff; padding: 18px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e1d7f0; }
textarea { width: 100%; padding: 14px; border: 1px solid #e6dfd9; border-radius: 14px; resize: none; font-size: 15px; background: #faf8f6; }
.hashtag-input { width: 100%; padding: 10px; border: 1px solid #e6dfd9; border-radius: 10px; margin-top: 10px; }
button.btn-submit { width: 100%; background: #6d5c7e; color: white; border: none; padding: 14px; border-radius: 14px; font-weight: bold; margin-top: 12px; cursor: pointer; }
.search-box { display: flex; gap: 8px; margin-bottom: 20px; }
.search-box input { flex: 1; padding: 12px; border: 1px solid #e6dfd9; border-radius: 12px; }
.search-box button { background: #6d5c7e; color: white; border: none; padding: 0 16px; border-radius: 12px; }
.post { background: #fff; padding: 18px; border-radius: 20px; margin-bottom: 15px; border-left: 4px solid #bfaecf; word-break: break-all; }
.post-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: #9c9291; }
.post-id { font-weight: bold; color: #6d5c7e; }
.post-content { font-size: 15px; white-space: pre-line; }
.tag { display: inline-block; background: #f0ebf7; color: #6d5c7e; font-size: 12px; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
.post-actions { display: flex; gap: 15px; margin-top: 15px; font-size: 12px; }
.action-btn { background: none; border: none; color: #7a6f6d; cursor: pointer; }
.comment-section { margin-top: 15px; background: #fbfbfa; padding: 12px; border-radius: 12px; display: none; }
.comment-list { max-height: 150px; overflow-y: auto; font-size: 13px; }
.comment-item { padding: 4px 0; border-bottom: 1px solid #f3effa; }
.comment-box { display: flex; gap: 6px; }
.comment-box input { flex: 1; padding: 8px; border: 1px solid #e6dfd9; border-radius: 8px; }
.comment-box button { background: #8e8294; color: white; border: none; padding: 0 12px; border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
  <div id="welcome-screen">
    <div class="logo-garden">🕊️</div>
    <h2 class="welcome-title">Khu Vườn Bí Mật</h2>
    <p class="welcome-desc">Nơi dừng chân nhẹ lòng cho những tâm sự thầm kín.<br>Chúng mình cam kết bảo mật 100% ẩn danh.</p>
    <button class="enter-btn" onclick="enterGarden()">Bước vào Khu Vườn</button>
  </div>
  <div id="main-content">
    <header>
      <h1>Khu Vườn Bí Mật 🌸</h1>
      <div class="badge-secure">🔒 Kết nối ẩn danh bảo mật</div>
    </header>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('goc-chia-se', event)">Góc Chia Sẻ</button>
      <button class="tab-btn" onclick="switchTab('hom-thu-bi-mat', event)">Hòm Thư Bí Mật</button>
    </div>
    <div id="goc-chia-se" class="tab-content active">
      <div class="form-box">
        <h3>Gửi câu chuyện kết nối:</h3>
        <textarea id="shareInput" placeholder="Tâm sự câu chuyện của bạn..." rows="4"></textarea>
        <input type="text" id="tagInput" class="hashtag-input" placeholder="Hashtag (Ví dụ: #tinhyeu)">
        <button class="btn-submit" id="btnShare" onclick="submitSharePost()">Đăng bài</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm hashtag...">
        <button onclick="searchPosts()">Tìm</button>
      </div>
      <div id="postsContainer"></div>
    </div>
    <div id="hom-thu-bi-mat" class="tab-content">
      <div class="form-box">
        <h3>Thư gửi đi không cần hồi đáp ✉️</h3>
        <textarea id="secretInput" placeholder="Trút bỏ tủi hờn vào đây..." rows="5"></textarea>
        <button class="btn-submit" id="btnSecret" onclick="submitSecretLetter()">Gửi thư</button>
      </div>
    </div>
  </div>
</div>
<script>
const GOOGLE_SCRIPT_URL = 'THAY_LINK_CỦA_BẠN';
let posts = JSON.parse(localStorage.getItem('g_posts')) || [];
let postIdCounter = parseInt(localStorage.getItem('g_id')) || 100;

function enterGarden() {
  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}
function switchTab(tabId, event) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  event.target.classList.add('active');
}
function sendToGoogleSheet(type, content, tags, buttonId, successCallback) {
  if (GOOGLE_SCRIPT_URL === 'THAY_LINK_CỦA_BẠN') { successCallback(); return; }
  const btn = document.getElementById(buttonId);
  btn.disabled = true; btn.innerText = "Đang gửi...";
  fetch(`${GOOGLE_SCRIPT_URL}?type=${encodeURIComponent(type)}&content=${encodeURIComponent(content)}&tags=${encodeURIComponent(tags)}`, { method: 'POST' })
  .then(res => res.json()).then(data => { if(data.result === "success") successCallback(); })
  .catch(err => { successCallback(); })
  .finally(() => { btn.disabled = false; btn.innerText = "Hoàn thành"; });
}
function submitSecretLetter() {
  const text = document.getElementById('secretInput').value.trim();
  if(!text) return alert("Hãy viết gì đó!");
  sendToGoogleSheet('Hòm Thư', text, '', 'btnSecret', function() {
    alert("Thư bí mật đã gửi đi! ✨");
    document.getElementById('secretInput').value = "";
  });
}
function submitSharePost() {
  const content = document.getElementById('shareInput').value.trim();
  const tagsText = document.getElementById('tagInput').value.trim();
  if(!content) return alert("Hãy điền nội dung!");
  const tags = tagsText ? tagsText.split(/[\s,]+/).map(t => t.startsWith('#') ? t : '#'+t) : [];
  sendToGoogleSheet('Góc Chia Sẻ', content, tags.join(', '), 'btnShare', function() {
    postIdCounter++;
    const newPost = { id: postIdCounter, content: content, tags: tags, time: new Date().toLocaleTimeString('vi-VN'), likes: 0, views: 15, reports: 0, comments: [] };
    posts.unshift(newPost); saveData(); renderAllPosts(posts);
    document.getElementById('shareInput').value = "";
    document.getElementById('tagInput').value = "";
  });
}
function renderAllPosts(postsToRender) {
  const container = document.getElementById('postsContainer');
  container.innerHTML = '';
  postsToRender.forEach(post => {
    const postEl = document.createElement('div'); postEl.className = 'post';
    const tagsHtml = post.tags.map(t => `<span class="tag" onclick="filterByTag('${t}')">${t}</span>`).join('');
    postEl.innerHTML = `<div class="post-header"><span class="post-id">#vườn_${post.id}</span><span>${post.time}</span></div>
    <p class="post-content">${post.content}</p><div class="post-tags">${tagsHtml}</div>
    <div class="post-actions">
      <button class="action-btn" onclick="likePost(${post.id})">❤️ ${post.likes}</button>
      <button class="action-btn" onclick="toggleComments(${post.id})">💬 Bình luận</button>
      <button class="action-btn" onclick="reportPost(${post.id})">⚠️ Báo cáo</button>
    </div>
    <div class="comment-section" id="comments-${post.id}">
      <div class="comment-list" id="comment-list-${post.id}">${post.comments.map(c => `<div class="comment-item"><b>Ẩn danh:</b> ${c}</div>`).join('')}</div>
      <div class="comment-box"><input type="text" id="c-input-${post.id}" placeholder="Phản hồi..."><button onclick="addComment(${post.id})">Gửi</button></div>
    </div>`;
    container.appendChild(postEl);
  });
  saveData();
}
function likePost(id) { const post = posts.find(p => p.id === id); if(post) { post.likes++; renderAllPosts(posts); } }
function toggleComments(id) { const el = document.getElementById(`comments-${id}`); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
function addComment(id) { const input = document.getElementById(`c-input-${id}`); const text = input.value.trim(); if(!text) return; const post = posts.find(p => p.id === id); if(post) { post.comments.push(text); renderAllPosts(posts); } }
function reportPost(id) { const postIndex = posts.findIndex(p => p.id === id); if(postIndex === -1) return; posts.splice(postIndex, 1); alert("Đã gỡ bài viết vi phạm."); renderAllPosts(posts); }
function searchPosts() { const query = document.getElementById('searchInput').value.trim().toLowerCase(); if(!query) return renderAllPosts(posts); const filtered = posts.filter(p => p.content.toLowerCase().includes(query) || p.tags.some(t => t.toLowerCase().includes(query))); renderAllPosts(filtered); }
function filterByTag(tag) { document.getElementById('searchInput').value = tag; searchPosts(); }
function saveData() { localStorage.setItem('g_posts', JSON.stringify(posts)); localStorage.setItem('g_id', postIdCounter); }
renderAllPosts(posts);
</script>
</body>
</html>
